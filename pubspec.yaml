name: milky_chat
description: MilkyChat - P2P local network chat, no server needed.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  network_info_plus: ^5.0.3
  uuid: ^4.2.1
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  intl: ^0.19.0
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
