name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Bootstrap missing Android scaffold
        run: |
          if [ ! -f android/build.gradle ] && [ ! -f android/build.gradle.kts ]; then
            echo "Android scaffolding missing — regenerating with flutter create"
            if [ -f android/app/src/main/AndroidManifest.xml ]; then
              cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
            fi
            flutter create --platforms=android --org=com.milkychat --project-name=milky_chat .
            if [ -f /tmp/AndroidManifest.xml.bak ]; then
              cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
            fi
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
